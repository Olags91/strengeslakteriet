<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strengeslakteriet – kommer snart</title>
  <meta name="description" content="Strengeslakteriet: musikk, lyd og undervisning. Nettsiden er under oppbygging.">
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1f2a30;
      --muted: #5d6a70;
      --brand: #1f4d4a;
      --brand-dark: #153634;
      --accent: #d98c3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, var(--brand-dark), var(--brand));
      text-align: center;
      line-height: 1.6;
    }
    main { max-width: 620px; }
    .kicker {
      text-transform: uppercase; letter-spacing: 0.14em;
      font-size: 0.85rem; font-weight: 600; color: var(--accent); margin: 0 0 1rem;
    }
    h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); margin: 0 0 0.4em; line-height: 1.1; }
    h1 span { color: var(--accent); }
    p { color: #e3ece9; font-size: 1.1rem; margin: 0 0 1.2rem; }
    .tags {
      display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;
      list-style: none; padding: 0; margin: 1.8rem 0 2rem;
    }
    .tags li {
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px; padding: 0.25rem 0.9rem; font-size: 0.92rem; color: #e3ece9;
    }
    .btn {
      display: inline-block; padding: 0.8rem 1.5rem; border-radius: 999px;
      background: var(--accent); color: #1f1405; font-weight: 600; text-decoration: none;
    }
    .btn:hover { filter: brightness(1.08); }
    small { display: block; margin-top: 2.5rem; color: #a9bfba; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Under oppbygging</p>
    <h1>Strengeslakteriet<span>.</span></h1>
    <p>Her bygges det en ny nettside. Snart finner du tjenester, priser og kontaktinformasjon her.</p>

    <ul class="tags">
      <li>Musikk</li>
      <li>Undervisning</li>
      <li>Studio</li>
      <li>Arrangering</li>
      <li>Lydteknikk</li>
      <li>Utleie av lydutstyr</li>
    </ul>

    <!-- Bytt ut lenken med din egen Instagram-adresse, eller fjern knappen. -->
    <a class="btn" href="https://www.instagram.com/DITT_BRUKERNAVN/">Følg oss på Instagram</a>

    <small>Ola [Etternavn]</small>
  </main>
</body>
</html>
